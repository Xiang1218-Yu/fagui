services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fagui
      POSTGRES_PASSWORD: fagui
      POSTGRES_DB: fagui
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fagui"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fagui:fagui@db:5432/fagui
      REDIS_URL: redis://redis:6379/0
      CRAWL_EAGER: "false"
      DEMO_BASE_URL: http://backend:8000/demo-site/
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage:/app/data

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://fagui:fagui@db:5432/fagui
      REDIS_URL: redis://redis:6379/0
      CRAWL_EAGER: "false"
      DEMO_BASE_URL: http://backend:8000/demo-site/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - storage:/app/data

  beat:
    build: ./backend
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://fagui:fagui@db:5432/fagui
      REDIS_URL: redis://redis:6379/0
      CRAWL_EAGER: "false"
      DEMO_BASE_URL: http://backend:8000/demo-site/
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - storage:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
